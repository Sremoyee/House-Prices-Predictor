<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1724"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="8" fill="url(#g)"/>
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="220" height="180" rx="8" fill="#0f1724" opacity="0.12"/>
    <g transform="translate(20,18)">
      <!-- Icon: minimal house + regression line -->
      <path d="M28 90 L28 60 L48 60 L48 90 Z" fill="none" stroke="#9ad0ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M12 72 L28 54 L44 72" fill="none" stroke="#66c2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="90" r="3.5" fill="#7fd1ff"/>
      <circle cx="44" cy="78" r="3.5" fill="#7fd1ff"/>
      <circle cx="68" cy="60" r="3.5" fill="#7fd1ff"/>
    </g>
  </g>

  <g transform="translate(320,70)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">
      House Price Predictor
    </text>
    <text x="0" y="46" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c7d2fe">
      Linear Regression • Jupyter Notebook • scikit-learn
    </text>
    <g transform="translate(0,90)">
      <rect x="0" y="0" width="640" height="6" rx="3" fill="#0b1220" />
      <!-- Accent gradient line -->
      <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#66c2ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
      <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#acc)"/>
    </g>
  </g>

  <g transform="translate(980,40)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Author</text>
    <text x="0" y="22" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Sremoyee Bag</text>
  </g>
</svg>
